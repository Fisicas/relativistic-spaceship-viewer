[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relativistic-spaceship-viewer"
version = "0.2.2"
description = "Instantaneous special-relativistic sky appearance with explicit scientific conventions"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "matplotlib>=3.7", "PySide6>=6.6"]

[project.optional-dependencies]
catalogs = ["astroquery>=0.4.7", "astropy>=5.3"]

[project.scripts]
relativistic-spaceship-viewer = "spaceship_viewer.entry:main"

[tool.setuptools]
packages = ["spaceship_viewer"]
py-modules = ["relativistic_spaceship_viewer"]
