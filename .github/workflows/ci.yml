name: Scientific and desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            packaging/requirements-runtime.lock
            packaging/requirements-build.lock
      - name: Install pinned runtime and validation dependencies
        run: python -m pip install -r packaging/requirements-runtime.lock -r packaging/requirements-build.lock
      - name: Scientific, import, session, and deployment tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Qt integration checks
        run: python -X utf8 tools/smoke_qt.py --output qt-check.json
      - name: Source runtime self-test
        run: python -X utf8 -m spaceship_viewer --self-test runtime-check.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-checks
          path: '*check.json'
  release-build:
    if: github.event_name == 'workflow_dispatch'
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            packaging/requirements-runtime.lock
            packaging/requirements-build.lock
      - run: python -m pip install -r packaging/requirements-runtime.lock -r packaging/requirements-build.lock
      - run: python -X utf8 packaging/build_release.py --output-dir dist/release --work-dir build/release
      - name: Verify packaged runtime
        run: python -c "import subprocess; subprocess.run(['build/release/application/RelativisticSpaceshipViewer/RelativisticSpaceshipViewer.exe','--self-test','frozen-check.json'],check=True,timeout=120)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-release-assets
          path: dist/release/*
# This workflow has no release-publication job and no repository write permission.
